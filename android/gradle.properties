# Project-wide Gradle settings for the SolarGrid Android app (owner: Ravindu).
# Memory for the Gradle daemon and UTF-8 source files.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse the build configuration when the build scripts have not changed.
org.gradle.configuration-cache=true
# The app uses AndroidX libraries only.
android.useAndroidX=true
